name: Estuda Aí

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — geração, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/estuda_ai_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/estuda_ai_integration_test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estuda_ai_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d estuda_ai_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm test
      - run: npm run test:integration -w apps/api
      - run: npm run build

  flutter_web:
    name: Flutter — geração, análise, testes e Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Conferir modelos gerados versionados
        working-directory: .
        run: git diff --exit-code -- apps/client/lib/core/models
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar navegador e ferramentas de verificação
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verificar build no navegador
        working-directory: .
        run: |
          mkdir -p artifacts
          node tools/preview.mjs > artifacts/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4173/ -o /dev/null
          npm run test:visual
          npm run test:study
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: estuda-ai-verification
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: estuda-ai-web
          path: apps/client/build/web
          if-no-files-found: error
          retention-days: 7
