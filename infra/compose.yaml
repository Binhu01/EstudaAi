name: estuda-ai

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no arquivo .env}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STEVE_MODEL: ${STEVE_MODEL:-}
      STEVE_DAILY_LIMIT: ${STEVE_DAILY_LIMIT:-10}
      STEVE_GLOBAL_DAILY_LIMIT: ${STEVE_GLOBAL_DAILY_LIMIT:-1000}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS no arquivo .env}
    secrets:
      - firebase_admin
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s

  # Job explícito. Nunca aplica migrações no bootstrap da API.
  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migration
    restart: "no"
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  firebase_admin:
    file: ${FIREBASE_ADMIN_CREDENTIALS_FILE:?Defina o caminho absoluto da credencial Firebase fora do repositório}
